[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-local-ui"
version = "2.0.0"
description = "Local client and backend bridge daemon for Google Gemini web accounts with AGY Mission Control"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "wreq>=0.13.0",
    "structlog>=24.1.0",
    "mcp>=2.3.0",
    "sqlite-vec>=0.1.9",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]
rag = [
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["*"]
exclude = ["*.tests*", "*.cache*"]

[tool.ruff.lint.per-file-ignores]
"backend/app/mcp/builtin_tools_server.py" = ["F401"]
