[package]
name = "gemini-local-ui-desktop"
version = "0.1.0"
edition = "2024"
description = "Tauri v2 Windows Desktop Supervisor, Win32 Job Sidecar Manager & NMH Installer for Gemini Local UI"
license = "Apache-2.0"

[lib]
name = "gemini_local_ui_desktop"
path = "src/lib.rs"

[[bin]]
name = "gemini-local-ui-desktop"
path = "src/main.rs"

[features]
default = []
tauri-gui = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-updater",
]

[dependencies]
agy-ultra-acp = { path = "../../agy-ultra-acp" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }
