name: Desktop Release & Code Signing (M9)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-sign-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Gemini Local UI
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python Dependencies & Quality Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[otel,rag]" ruff pytest pytest-timeout pyinstaller websockets

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Lint & Regression Tests
        run: |
          python -m ruff check backend/sidecar_entry.py backend/app/main.py backend/app/security/origin_guard.py
          python -u -m pytest backend/tests/test_stage55_hardening.py backend/tests/test_m6a_architecture_and_telemetry.py backend/tests/test_m6b_mcp_elicitation_and_contract.py backend/tests/test_hybrid_rag_rrf.py --timeout=60 -q

      - name: Frontend Typecheck, Vitest & Production Bundle
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Build PyInstaller Onedir Sidecar Bundle
        shell: pwsh
        run: ./scripts/build_sidecar.ps1

      - name: Build Tauri v2 NSIS Installer & Updater Manifest
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Gemini Local UI v__VERSION__"
          args: --features tauri-gui --bundles nsis
          includeUpdaterJson: true

      - name: Azure Trusted Signing / SignPath Authenticode Verification
        if: env.AZURE_SIGNING_ENDPOINT != ''
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        shell: pwsh
        run: |
          $SidecarExe = "src-tauri\binaries\gemini-backend-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $SidecarExe)) {
            throw "Missing sidecar executable: $SidecarExe"
          }
          signtool verify /pa $SidecarExe

          $SetupExe = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $SetupExe) {
            throw "Missing NSIS setup installer under src-tauri\target\release\bundle\nsis"
          }
          signtool verify /pa $SetupExe.FullName
